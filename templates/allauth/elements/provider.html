<li class="social-provider-item">

    <a
        href="{{ attrs.href }}"
        title="{{ attrs.name }}"
        class="social-provider-button"
    >

        {% if attrs.name == "Google" %}

            <svg
                class="social-provider-icon"
                width="20"
                height="20"
                viewBox="0 0 18 18"
                aria-hidden="true"
            >
                <path
                    fill="#4285F4"
                    d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.716v2.258h2.909c1.702-1.567 2.684-3.875 2.684-6.615z"
                />
                <path
                    fill="#34A853"
                    d="M9 18c2.43 0 4.468-.806 5.956-2.18l-2.909-2.258c-.806.54-1.835.859-3.047.859-2.344 0-4.328-1.585-5.037-3.715H.956v2.332A9 9 0 0 0 9 18z"
                />
                <path
                    fill="#FBBC05"
                    d="M3.963 10.706A5.41 5.41 0 0 1 3.682 9c0-.592.102-1.167.281-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.45.347 2.823.956 4.038l3.007-2.332z"
                />
                <path
                    fill="#EA4335"
                    d="M9 3.579c1.321 0 2.507.454 3.441 1.346l2.581-2.581C13.463.892 11.425 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.164 6.656 3.579 9 3.579z"
                />
            </svg>

            <span>Continuer avec Google</span>

        {% else %}

            <span>Continuer avec {{ attrs.name }}</span>

        {% endif %}

    </a>

</li>
